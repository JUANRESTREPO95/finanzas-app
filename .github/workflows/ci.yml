name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every JavaScript file
        run: |
          set -e
          for f in backend/*.js frontend/*.js; do
            echo "· $f"
            node --check "$f"
          done
